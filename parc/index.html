<style>
:root{
  --bg:#eceff1;--panel:#ffffff;--ink:#15232e;--mute:#5b6b77;--line:#d5dce1;--zebra:#f5f7f8;
  --accent:#0b5a8e;--accent-ink:#ffffff;--head:#0c3a5b;--head-ink:#ffffff;
  --ok:#23794f;--okbg:#e2f3ea;--warn:#7a4f00;--warnbg:#fdf0cf;--bad:#b3261e;--badbg:#fbe1de;--unk:#5b6b77;--unkbg:#e6eaed;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171d;--panel:#17232c;--ink:#e6edf1;--mute:#93a4b0;--line:#2a3a46;--zebra:#1b2a34;
  --accent:#5cb0e6;--accent-ink:#06202f;--head:#0a2436;--head-ink:#e6edf1;
  --ok:#5fcf97;--okbg:#12352a;--warn:#f0c15a;--warnbg:#3a2f10;--bad:#ff8a80;--badbg:#40191a;--unk:#93a4b0;--unkbg:#22313b;}}
:root[data-theme="dark"]{
  --bg:#0f171d;--panel:#17232c;--ink:#e6edf1;--mute:#93a4b0;--line:#2a3a46;--zebra:#1b2a34;
  --accent:#5cb0e6;--accent-ink:#06202f;--head:#0a2436;--head-ink:#e6edf1;
  --ok:#5fcf97;--okbg:#12352a;--warn:#f0c15a;--warnbg:#3a2f10;--bad:#ff8a80;--badbg:#40191a;--unk:#93a4b0;--unkbg:#22313b;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand{align-items:center}
.logo-badge{background:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:5px 12px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.brand .logo-badge{margin-right:2px}
.brand .logo-badge img{height:26px;width:auto;display:block}
#gate .logo-badge{align-self:center;margin:0 auto 4px;padding:10px 20px;box-shadow:none;border:1px solid var(--line)}
#gate .logo-badge img{height:46px;width:auto;display:block}
.sync{font-size:12px;opacity:.75;margin-left:auto}
.tools{display:flex;gap:6px}
.parcs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.parcs button{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--head-ink);border-radius:99px;padding:3px 13px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.parcs button[aria-pressed="true"]{background:var(--head-ink);color:var(--head);border-color:var(--head-ink)}
.parcs button:hover{border-color:var(--head-ink)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--head-ink);opacity:.72;padding:8px 12px;font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{opacity:1;border-bottom-color:#5cb0e6}
nav button:hover{opacity:1}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:18px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.top .btn{background:transparent;color:var(--head-ink);border-color:rgba(255,255,255,.35);font-size:13px;padding:3px 9px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.blk>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.blk>header h2{font-family:var(--disp);font-size:19px;letter-spacing:.04em;text-transform:uppercase;margin:0;font-weight:700}
.blk>header .sp{flex:1}
.pad{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.kpi b{display:block;font-family:var(--disp);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute)}
.kpi.late b{color:var(--bad)}.kpi.soon b{color:var(--warn)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.late{background:var(--badbg);color:var(--bad)}.pill.soon{background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.unk,.pill.info{background:var(--unkbg);color:var(--unk)}
.pill.ex{background:var(--unkbg);color:var(--mute);font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--disp);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;text-align:left;color:var(--mute);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:var(--zebra)}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--zebra);outline:1px solid var(--accent);outline-offset:-1px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.s-late td:first-child{box-shadow:inset 4px 0 0 var(--bad)}tr.s-soon td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.mute{color:var(--mute)}.small{font-size:13px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.todo li:last-child{border-bottom:0}.todo li:hover{background:var(--zebra)}
.todo .w{flex:1;min-width:0}.todo .w b{font-weight:600}
.gauge{height:8px;background:var(--unkbg);border-radius:4px;overflow:hidden;min-width:90px}
.gauge i{display:block;height:100%;background:var(--ok)}.gauge i.soon{background:var(--warn)}.gauge i.late{background:var(--bad)}
.plans{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(110px,1fr) minmax(130px,1fr) auto auto;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.plans:last-child{border-bottom:0}
.acts{display:flex;gap:6px}
@media (max-width:640px){.plans{grid-template-columns:1fr 1fr}.plans .acts{grid-column:1/-1}}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.bar .t{height:14px;background:var(--unkbg);border-radius:3px}.bar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
@media (max-width:640px){.bar{grid-template-columns:1fr auto}.bar .t{grid-column:1/-1;order:3}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px}
.kv div span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 9px;width:100%}
.filters select{width:auto}
.empty{padding:22px 16px;color:var(--mute);text-align:center}
.note{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note span{flex:1;min-width:220px}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(5,15,22,.55)}
dialog form{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
dialog h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:21px;margin:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg .w{grid-column:1/-1}
@media (max-width:520px){.fg{grid-template-columns:1fr}}
.fg label{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.fg .chk{display:flex;gap:8px;align-items:center;text-transform:none;font-size:15px;color:var(--ink);letter-spacing:0;padding-top:20px}
.fg .chk input{width:auto}
.fa{display:flex;gap:8px;flex-wrap:wrap}.fa .sp{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:20;max-width:90vw}
.wk input{min-width:90px}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumb h2{font-family:var(--disp);font-size:30px;text-transform:uppercase;letter-spacing:.03em;margin:0}
@media (prefers-reduced-motion:no-preference){.gauge i{transition:width .3s}}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 26px;width:min(360px,100%);display:flex;flex-direction:column;gap:14px}
#gate h1{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:22px;margin:0}
#gate p{margin:0;color:var(--mute);font-size:14px}
#gate .err{color:var(--bad);font-size:13px;min-height:1.2em}
[hidden]{display:none!important}
</style>
</head>

function norm(d){

/* ---------- Persistance ---------- */
let dbDoc=null,timer=null,dirty=false,syncMode='local';
function setSync(m){syncMode=m;$('#sync').textContent={local:'Enregistré sur cet appareil',shared:'Enregistré · partagé',err:"Erreur d'enregistrement",wait:'Enregistrement…'}[m]||''}
function persist(){
  dirty=true;setSync(dbDoc?'wait':'local');
  try{localStorage.setItem(LS,JSON.stringify(S))}catch{}
  clearTimeout(timer);timer=setTimeout(flush,500);
}
async function flush(){
  if(!dbDoc){dirty=false;return}
  try{await dbDoc.set(JSON.parse(JSON.stringify(S)));dirty=false;setSync('shared')}
  catch(e){dirty=false;setSync('err');toast("Enregistrement partagé impossible (lecture seule ?). Copie gardée sur cet appareil.")}
}
(async()=>{
  try{
    const db=await window.claude?.use?.('db');
    if(!db)return;
    dbDoc=db.doc('parc/etat');setSync('shared');
    dbDoc.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||dirty)return;
      if(snap.exists){
        const d=norm(JSON.parse(JSON.stringify(snap.data())));
        const mig=didMigrate;didMigrate=false;
        if(JSON.stringify(d)!==JSON.stringify(S)){S=d;try{localStorage.setItem(LS,JSON.stringify(S))}catch{};render();if(mig)persist()}
      }
    },()=>{});
  }catch{}
})();

function planInfo(p){
  const m=M(p.mid),u=U(m);
  if(!m||m.heures==null||p.nextH==null)return{st:'unk',rem:null,pct:0,u};
  const rem=p.nextH-m.heures,al=p.alertH??(u==='km'?3000:50);
  const st=rem<0?'late':rem<=al?'soon':'ok';
  const pct=p.intervalH?Math.max(0,Math.min(100,(m.heures-(p.nextH-p.intervalH))/p.intervalH*100)):(st==='ok'?30:100);
  return{st,rem,pct,u};
}
const remTxt=i=>i.rem==null?'échéance ou compteur à renseigner':i.rem<0?`dépassée de ${nf(-i.rem)} ${i.u}`:`reste ${nf(i.rem)} ${i.u}`;
function ctrlInfo(c){const d=daysTo(c.echeance);return{st:d<0?'late':d<=30?'soon':'ok',d}}
const ctrlTxt=i=>i.d<0?`dépassé de ${-i.d} j`:i.d===0?"aujourd'hui":`dans ${i.d} j`;
function worst(a){return a.reduce((w,s)=>RANK[s]>RANK[w]?s:w,'unk')}
function machineState(m){
  const s=[...S.plans.filter(p=>p.mid===m.id).map(p=>planInfo(p).st),...S.controles.filter(c=>c.mid===m.id).map(c=>ctrlInfo(c).st)];
  if(m.aPrevoir)s.push('soon');
  return s.length?worst(s.filter(x=>x!=='unk').length?s.filter(x=>x!=='unk'):['unk']):'unk';
}
function lastReleve(mid){return S.releves.filter(r=>r.mid===mid&&r.date).map(r=>r.date).sort().pop()||''}
function todo(){
  const it=[];
  for(const p of S.plans){if(!inP(p.mid))continue;const i=planInfo(p);if(i.st==='late'||i.st==='soon')it.push({st:i.st,mid:p.mid,t:p.label,d:`${remTxt(i)} (à ${cv(M(p.mid),p.nextH)})`,sort:i.rem})}
  for(const c of S.controles){if(!inP(c.mid))continue;const i=ctrlInfo(c);if(i.st!=='ok')it.push({st:i.st,mid:c.mid,t:c.libelle,d:`échéance ${fd(c.echeance)}, ${ctrlTxt(i)}`,sort:i.d,go:'controles'})}
  for(const s of S.stock){if(s.mid&&!inP(s.mid))continue;if(s.mini>0&&s.qte<=s.mini)it.push({st:s.qte<=0?'late':'soon',mid:s.mid,t:s.designation,d:`${nf(s.qte)} en stock (mini ${nf(s.mini)})`,sort:s.qte-s.mini,go:'stock'})}
  for(const m of ms())if(m.aPrevoir)it.push({st:'soon',mid:m.id,t:'À prévoir',d:m.aPrevoir,sort:1e9});
  it.sort((a,b)=>RANK[b.st]-RANK[a.st]||a.sort-b.sort);
  const rel=[],stale=ms().filter(m=>m.type!=='Remorque'&&m.heures!=null&&(!lastReleve(m.id)||daysTo(lastReleve(m.id))<-9));
  if(stale.length)rel.push({st:'info',mid:'',t:'Relevés de compteur',d:`${stale.length} machine${stale.length>1?'s':''} sans relevé récent : ${stale.slice(0,4).map(m=>m.nom).join(', ')}${stale.length>4?'…':''}`,go:'releves'});
  return it.concat(rel);
}

function fld(f,v){
  const id='f_'+f.k,c=f.w?' class="w"':'';
  if(f.t==='check')return`<div${c}><label class="chk"><input type="checkbox" id="${id}" name="${f.k}"${v?' checked':''}> ${esc(f.l)}</label></div>`;
  let i;
  if(f.t==='select')i=`<select id="${id}" name="${f.k}">${f.o.map(([a,b])=>`<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else if(f.t==='textarea')i=`<textarea id="${id}" name="${f.k}" rows="3">${esc(v)}</textarea>`;
  else i=`<input id="${id}" name="${f.k}" type="${f.t||'text'}"${f.t==='number'?' step="any" inputmode="decimal"':''} value="${esc(v)}"${f.r?' required':''}>`;

function form(title,fields,vals,onSave,onDel){

  d.querySelector('#fcan').onclick=()=>d.close();
  if(onDel)d.querySelector('#fdel').onclick=()=>confirmBox('Supprimer définitivement cet élément ?',()=>{onDel();persist();render()});
  d.querySelector('form').onsubmit=e=>{
    e.preventDefault();const out={};
    for(const f of fields){const el=d.querySelector('#f_'+f.k);
      out[f.k]=f.t==='check'?el.checked:f.t==='number'?(el.value===''?null:parseFloat(el.value)):el.value.trim()}
    if(onSave(out)===false)return;
    d.close();persist();render();
  };

}
function confirmBox(msg,yes){

  return`<div class="crumb"><button class="btn sm" data-a="nav" data-v="parc">← Parc</button><h2>${esc(m.nom)}</h2>${pill(machineState(m))}<span class="sp" style="flex:1"></span><button class="btn" data-a="editMachine" data-id="${m.id}">Modifier la fiche</button></div>
  <section class="blk"><header><h2>Fiche</h2><span class="sp"></span><button class="btn sm pri" data-a="addReleve" data-id="${m.id}">Relevé de compteur</button></header><div class="pad kv">
    <div><span>Compteur</span><b style="font-size:22px;font-family:var(--disp)">${cv(m,m.heures)}</b></div>${kv('Type',m.type)}${m.immat?kv('Immatriculation',m.immat):''}${m.chauffeur?kv('Chauffeur / affectation',m.chauffeur):''}${kv('Référence / modèle',[m.marque,m.modele].filter(Boolean).join(' '))}${kv('N° de série',m.serie)}${kv('Mise en service',m.service?fd(m.service):'')}
    ${(U(m)==='h'||m.refHuile||m.refHydro||m.refGasoil||m.refAir)?kv('Filtre huile',m.refHuile)+kv('Filtre hydraulique',m.refHydro)+kv('Filtre gasoil',m.refGasoil)+kv('Filtre air',m.refAir):''}${m.refAutres?kv('Autres pièces',m.refAutres):''}${m.aPrevoir?`<div class="w" style="grid-column:1/-1"><span>À prévoir</span><b>${esc(m.aPrevoir)}</b></div>`:''}</div></section>
  <section class="blk"><header><h2>Entretien programmé</h2><span class="sp"></span><button class="btn sm" data-a="addPlan" data-id="${m.id}">Ajouter</button></header>
  ${plans.length?plans.map(p=>{const i=planInfo(p);return`<div class="plans"><div><b>${esc(p.label)}</b><div class="small mute">${p.intervalH?`tous les ${nf(p.intervalH)} ${U(m)}`:'échéance unique'}</div></div><div><div class="small">prochaine à <b>${cv(m,p.nextH)}</b></div><div class="small mute">${remTxt(i)}</div></div><div class="gauge" title="${remTxt(i)}"><i class="${i.st}" style="width:${i.pct}%"></i></div>${pill(i.st)}<div class="acts"><button class="btn sm pri" data-a="donePlan" data-id="${p.id}">Fait</button><button class="btn sm" data-a="editPlan" data-id="${p.id}">Modifier</button></div></div>`}).join(''):empty(m.heures==null?"Cette machine n'a pas de compteur horaire : suivez-la par contrôles ou interventions.":'Aucune opération programmée. Ajoutez par exemple une vidange moteur.')}</section>
  ${cs.length?`<section class="blk"><header><h2>Contrôles</h2></header><div class="tw"><table><tbody>${cs.map(c=>{const i=ctrlInfo(c);return`<tr class="clk" data-a="editCtrl" data-id="${c.id}"><td>${esc(c.libelle)}</td><td>${fd(c.echeance)}</td><td>${pill(i.st)}</td></tr>`}).join('')}</tbody></table></div></section>`:''}
  <section class="blk"><header><h2>Historique des travaux</h2><span class="sp"></span><button class="btn sm" data-a="addTravail" data-id="${m.id}">Ajouter</button></header>${tblTravaux(tr,false)}</section>
  <section class="blk"><header><h2>Relevés de compteur</h2></header>${rl.length?`<div class="tw"><table><thead><tr><th>Date</th><th class="n">Compteur</th><th class="n">Fioul (L)</th><th>Vérif.</th><th>Observation</th></tr></thead><tbody>${rl.map(r=>`<tr class="clk" data-a="editReleve" data-id="${r.id}"><td>${fd(r.date)}</td><td class="n">${cv(m,r.heures)}</td><td class="n">${nf(r.conso)}</td><td>${r.verif?'Oui':'Non'}</td><td>${esc(r.obs)}</td></tr>`).join('')}</tbody></table></div>`:empty('Aucun relevé.')}</section>`;
}
function tblTravaux(list,withM){
  if(!list.length)return empty('Aucune intervention.');
  return`<div class="tw"><table><thead><tr><th>Date</th>${withM?'<th>Machine</th>':''}<th>Nature</th><th>Travaux</th><th class="n">Compteur</th><th>Fournisseur</th><th>Lieu</th><th class="n">Coût HT</th><th class="n">Temps</th></tr></thead><tbody>
  ${list.map(t=>`<tr class="clk" data-a="editTravail" data-id="${t.id}"><td class="n" style="text-align:left">${fd(t.date)}</td>${withM?`<td>${esc(mname(t.mid))}</td>`:''}<td>${TT[t.type]||''}</td><td>${esc(t.description)}</td><td class="n">${cv(M(t.mid),t.heures)}</td><td>${esc(t.fournisseur)||'—'}</td><td>${esc(t.lieu)||'—'}</td><td class="n">${eur(t.cout)}</td><td class="n">${t.duree==null?'—':nf(t.duree)+' h'}</td></tr>`).join('')}</tbody></table></div>`;
}
function viewTravaux(){
  let l=S.travaux.filter(t=>inP(t.mid)&&(!UI.fm||t.mid===UI.fm)&&(!UI.ft||t.type===UI.ft)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const tot=l.reduce((a,t)=>a+(t.cout||0),0),tps=l.reduce((a,t)=>a+(t.duree||0),0);
  return`<section class="blk"><header><h2>Travaux, pannes et coûts</h2><span class="sp"></span><button class="btn pri" data-a="addTravail">Ajouter une intervention</button></header>
  <div class="pad filters"><select id="fm" aria-label="Machine"><option value="">Toutes les machines</option>${ms().map(m=>`<option value="${m.id}"${UI.fm===m.id?' selected':''}>${esc(m.nom)}</option>`).join('')}</select>
  <select id="ft" aria-label="Nature"><option value="">Toutes natures</option>${Object.entries(TT).map(([k,v])=>`<option value="${k}"${UI.ft===k?' selected':''}>${v}</option>`).join('')}</select>
  <span class="mute small" style="margin-left:auto">${l.length} intervention${l.length>1?'s':''} · <b style="color:var(--ink)">${eur(tot)}</b> HT · ${nf(tps)} h passées</span></div>${tblTravaux(l,true)}</section>`;
}
function viewReleves(){
  const all=S.releves.filter(r=>inP(r.mid)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
  const wm=ms().filter(m=>m.type!=='Remorque');
  return`<section class="blk"><header><h2>Relevé de la semaine</h2><span class="sp"></span><label class="small mute" for="wkdate">Date</label><input type="date" id="wkdate" value="${today}" style="width:auto"></header>
  <div class="tw wk"><table><thead><tr><th>Machine</th><th class="n">Dernier compteur</th><th>Compteur fin de semaine</th><th>Fioul (L)</th><th>Vérif.</th><th>Observation</th></tr></thead><tbody>
  ${wm.map(m=>`<tr><td><b>${esc(m.nom)}</b> <span class="mute small">(${U(m)})</span></td><td class="n">${cv(m,m.heures)}</td><td><input type="number" step="any" inputmode="decimal" id="wh_${m.id}" aria-label="Compteur ${esc(m.nom)}" placeholder="${m.heures??''}"></td><td><input type="number" step="any" inputmode="decimal" id="wc_${m.id}" aria-label="Fioul ${esc(m.nom)}"></td><td><input type="checkbox" id="wv_${m.id}" aria-label="Vérification faite ${esc(m.nom)}"></td><td><input type="text" id="wo_${m.id}" aria-label="Observation ${esc(m.nom)}" style="min-width:160px"></td></tr>`).join('')}</tbody></table></div>
  <div class="pad"><button class="btn pri" data-a="saveWeek">Enregistrer le relevé</button> <span class="small mute">Seules les lignes renseignées sont enregistrées.</span></div></section>
  <section class="blk"><header><h2>Derniers relevés</h2></header>${all.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Machine</th><th class="n">Compteur</th><th class="n">Fioul (L)</th><th>Vérif.</th><th>Observation</th></tr></thead><tbody>${all.map(r=>`<tr class="clk" data-a="editReleve" data-id="${r.id}"><td>${fd(r.date)}</td><td>${esc(mname(r.mid))}</td><td class="n">${cv(M(r.mid),r.heures)}</td><td class="n">${nf(r.conso)}</td><td>${r.verif?'Oui':'Non'}</td><td>${esc(r.obs)}</td></tr>`).join('')}</tbody></table></div>`:empty('Aucun relevé.')}</section>`;
}
function viewControles(){
  const l=S.controles.filter(c=>inP(c.mid)).sort((a,b)=>a.echeance.localeCompare(b.echeance));
  return`<section class="blk"><header><h2>Contrôles réglementaires</h2><span class="sp"></span>${l.some(c=>c.ex)?'<button class="btn sm" data-a="rmExamples">Supprimer les exemples</button>':''}<button class="btn pri" data-a="addCtrl">Ajouter un contrôle</button></header>
  ${l.length?`<div class="tw"><table><thead><tr><th>Contrôle</th><th>Machine</th><th>Échéance</th><th>Périodicité</th><th>Dernier</th><th>État</th><th></th></tr></thead><tbody>
  ${l.map(c=>{const i=ctrlInfo(c);return`<tr class="s-${i.st}"><td><b>${esc(c.libelle)}</b>${c.ex?' <span class="pill ex">exemple</span>':''}${c.note&&!c.ex?`<div class="small mute">${esc(c.note)}</div>`:''}</td><td>${esc(mname(c.mid))}</td><td class="n" style="text-align:left">${fd(c.echeance)}<div class="small mute">${ctrlTxt(i)}</div></td><td>${c.periodeMois?c.periodeMois+' mois':'—'}</td><td>${fd(c.derniere)}</td><td>${pill(i.st)}</td><td><div class="acts"><button class="btn sm pri" data-a="doneCtrl" data-id="${c.id}">Fait</button><button class="btn sm" data-a="editCtrl" data-id="${c.id}">Modifier</button></div></td></tr>`}).join('')}</tbody></table></div>`:empty('Aucun contrôle. Ajoutez VGP, contrôle technique, assurance, extincteurs…')}</section>`;
}
function viewStock(){
  const l=S.stock.filter(s=>(!s.mid||inP(s.mid))&&(!UI.stm||s.mid===UI.stm)).sort((a,b)=>a.designation.localeCompare(b.designation,'fr'));
  const val=l.reduce((a,s)=>a+(s.qte||0)*(s.prix||0),0);
  return`<section class="blk"><header><h2>Pièces et consommables</h2><span class="sp"></span><button class="btn pri" data-a="addStock">Ajouter une pièce</button></header>
  <div class="pad filters"><select id="stm" aria-label="Machine"><option value="">Toutes les machines</option>${ms().map(m=>`<option value="${m.id}"${UI.stm===m.id?' selected':''}>${esc(m.nom)}</option>`).join('')}</select><span class="mute small" style="margin-left:auto">Valeur du stock : <b style="color:var(--ink)">${eur(val)}</b> HT</span></div>
  ${l.length?`<div class="tw"><table><thead><tr><th>Désignation</th><th>Référence</th><th>Machine</th><th class="n">En stock</th><th class="n">Mini</th><th class="n">Prix HT</th><th>Fournisseur</th><th></th></tr></thead><tbody>
  ${l.map(s=>{const st=s.mini>0&&s.qte<=s.mini?(s.qte<=0?'late':'soon'):'';return`<tr class="${st?'s-'+st:''}"><td><b>${esc(s.designation)}</b></td><td>${esc(s.ref)||'<span class="mute">à renseigner</span>'}</td><td>${s.mid?esc(mname(s.mid)):'—'}</td><td class="n"><span class="acts" style="justify-content:flex-end;align-items:center"><button class="btn sm" data-a="qty" data-id="${s.id}" data-n="-1" aria-label="Retirer un">−</button><b style="min-width:2ch;text-align:center">${nf(s.qte)}</b><button class="btn sm" data-a="qty" data-id="${s.id}" data-n="1" aria-label="Ajouter un">+</button></span></td><td class="n">${nf(s.mini)}</td><td class="n">${eur(s.prix)}</td><td>${esc(s.fournisseur)||'—'}</td><td><button class="btn sm" data-a="editStock" data-id="${s.id}">Modifier</button></td></tr>`}).join('')}</tbody></table></div>`:empty('Aucune pièce en stock.')}</section>`;
}
const NAV=[['dash','Tableau de bord'],['parc','Parc'],['releves','Relevés'],['travaux','Travaux & coûts'],['controles','Contrôles'],['stock','Stock']];
function render(){
  $('#parcs').innerHTML=[['','Tout le parc',S.machines.length],...PARCS.map(([k,l])=>[k,l,S.machines.filter(m=>m.parc===k).length])].map(([k,l,n])=>`<button data-a="setParc" data-v="${k}" aria-pressed="${UI.parc===k}">${l} · ${n}</button>`).join('');
  $('#nav').innerHTML=NAV.map(([k,l])=>`<button data-a="nav" data-v="${k}"${(UI.view===k||(UI.view==='machine'&&k==='parc'))?' aria-current="page"':''}>${l}</button>`).join('');
  const v={dash:viewDash,parc:viewParc,machine:viewMachine,travaux:viewTravaux,releves:viewReleves,controles:viewControles,stock:viewStock}[UI.view];
  $('#main').innerHTML=v();
  for(const [id,key] of [['fm','fm'],['ft','ft'],['stm','stm'],['pt','pt']]){const e=$('#'+id);if(e)e.onchange=()=>{UI[key]=e.value;render()}}
}
setSync('local');render();

let authed=false;
try{authed=localStorage.getItem(AUTH_KEY)==='1'}catch{}
if(authed)$('#gate').hidden=true;
$('#gateform').onsubmit=async e=>{
  e.preventDefault();
  const gp=$('#gp'),err=$('#gerr'),btn=e.target.querySelector('button');
  btn.disabled=true;
  const h=await sha256(gp.value);
  btn.disabled=false;
  if(h===AUTH_HASH){
    try{localStorage.setItem(AUTH_KEY,'1')}catch{}
    err.textContent='';$('#gate').hidden=true;
  }else{
    err.textContent='Mot de passe incorrect.';gp.value='';gp.focus();
  }
};
if(!authed)setTimeout(()=>$('#gp')?.focus(),0);
</script>

</body>
</html>
